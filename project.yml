name: SiriMetra
options:
  bundleIdPrefix: com.sirimetra
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: SiriMetra/Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""

targets:
  SiriMetra:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SiriMetra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sirimetra.app
        INFOPLIST_FILE: SiriMetra/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SiriMetra/Resources/SiriMetra.entitlements
        SWIFT_VERSION: "5.9"
    entitlements:
      path: SiriMetra/Resources/SiriMetra.entitlements

schemes:
  SiriMetra:
    build:
      targets:
        SiriMetra: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
